apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${BACKEND_APP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${BACKEND_APP_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${BACKEND_APP_NAME}
  template:
    metadata:
      labels:
        app: ${BACKEND_APP_NAME}
    spec:
      serviceAccountName: poc-next-sa
      containers:
      - name: backend
        image: ${BACKEND_IMAGE}:${BACKEND_IMAGE_TAG_VERSION}
        ports:
        - containerPort: ${BACKEND_SERVICE_PORT}
        envFrom:
        - configMapRef:
            name: poc-next-config
        - secretRef:
            name: poc-next-secrets
        env:
        - name: SHAREPOINT_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: sharepoint-proxy-credentials
              key: client-id
        - name: SHAREPOINT_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: sharepoint-proxy-credentials
              key: client-secret
        - name: SHAREPOINT_PROXY_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: sharepoint-proxy-credentials
              key: tenant-id
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "50m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: ${BACKEND_SERVICE_PORT}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: ${BACKEND_SERVICE_PORT}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${FRONTEND_APP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${FRONTEND_APP_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${FRONTEND_APP_NAME}
  template:
    metadata:
      labels:
        app: ${FRONTEND_APP_NAME}
    spec:
      serviceAccountName: poc-next-sa
      containers:
      - name: frontend
        image: ${FRONTEND_IMAGE}:${FRONTEND_IMAGE_TAG_VERSION}
        ports:
        - containerPort: ${FRONTEND_SERVICE_PORT}
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: poc-next-config
              key: NEXT_PUBLIC_API_URL
        - name: NEXT_PUBLIC_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: poc-next-config
              key: NEXT_PUBLIC_APP_NAME
        - name: NEXT_PUBLIC_APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: poc-next-config
              key: NEXT_PUBLIC_APP_VERSION
        - name: NEXT_PUBLIC_AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: poc-next-config
              key: NEXT_PUBLIC_AZURE_CLIENT_ID
        - name: NEXT_PUBLIC_AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: poc-next-config
              key: NEXT_PUBLIC_AZURE_TENANT_ID
        - name: NEXT_PUBLIC_AZURE_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: poc-next-config
              key: NEXT_PUBLIC_AZURE_REDIRECT_URI
        - name: NEXT_PUBLIC_SHAREPOINT_SITE_URL
          valueFrom:
            configMapKeyRef:
              name: poc-next-config
              key: NEXT_PUBLIC_SHAREPOINT_SITE_URL
        resources:
          limits:
            cpu: "300m"
            memory: "512Mi"
          requests:
            cpu: "50m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /data-publication
            port: ${FRONTEND_SERVICE_PORT}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /data-publication
            port: ${FRONTEND_SERVICE_PORT}
          initialDelaySeconds: 5
          periodSeconds: 5
