apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharepoint-proxy
  namespace: ds-management-ui
  labels:
    app: sharepoint-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sharepoint-proxy
  template:
    metadata:
      labels:
        app: sharepoint-proxy
    spec:
      containers:
      - name: sharepoint-proxy
        image: xmendialdua/poc-next-backend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5001
          protocol: TCP
        env:
        - name: SHAREPOINT_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: sharepoint-proxy-credentials
              key: client-id
        - name: SHAREPOINT_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: sharepoint-proxy-credentials
              key: client-secret
        - name: SHAREPOINT_PROXY_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: sharepoint-proxy-credentials
              key: tenant-id
        - name: SHAREPOINT_PROXY_BASE_URL
          value: "http://sharepoint-proxy.ds-management-ui.svc.cluster.local:5001"
        command: ["uvicorn"]
        args:
          - "sharepoint_proxy_app:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "5001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 5