apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${BACKEND_APP_NAME}
  namespace: ${NAMESPACE}
  annotations:
    # NO rewrite: el backend FastAPI espera las rutas con /api
    # Desactivar redirección SSL
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Configurar timeouts para operaciones largas (descargas, transferencias EDC)
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - ${OVH_HOST}
    secretName: ds-management-tls
  rules:
  - host: ${OVH_HOST}
    http:
      paths:
      # Ruta para el backend API
      # /api/health -> /api/health en el backend
      # /api/phase1/... -> /api/phase1/... en el backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ${BACKEND_APP_NAME}
            port:
              number: 5001
